<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fbff">
  <meta name="description" content="Restful Booker: 7 bugs de API, 16 variações reproduzidas no Postman. Evidências, requisitos e impactos em apresentação interativa.">
  <title>Restful Booker — Bugs da API | Bug Hunters</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="report.css">
  <script src="data.js" defer></script>
  <script src="evidence-data.js" defer></script>
  <script src="cover-logo.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="presentation" id="presentation" aria-label="Apresentação Restful Booker">
    <header class="masthead"><a class="brandmark" href="#slide-1" aria-label="Bug Hunters — início"><img src="assets/bug-hunters-symbol.svg" alt=""><span>BUG<b>HUNTERS</b></span></a><div class="report-heading"><span>RESTFUL BOOKER</span><strong>Relatório de Bug</strong><small>Registro, evidência e análise de falhas</small></div><div class="report-meta"><a class="qa-badge front-mode-link" href="manual.html" aria-label="Mudar para documentação do Front em vídeo">Front · Vídeos ↗</a><span id="variation-label">Apresentação de resultados</span></div></header>
    <div id="slides" class="slides"></div>
    <footer class="controls">
      <div class="direction"><button id="previous" class="icon-button" aria-label="Slide anterior"></button><button id="next" class="icon-button" aria-label="Próximo slide"></button></div>
      <span id="counter" class="counter">01 / 12</span>
      <div class="progress" role="progressbar" aria-label="Progresso da apresentação" aria-valuemin="1" aria-valuemax="12" aria-valuenow="1"><span id="progress-fill"></span></div>
      <button id="open-index" class="text-button" aria-label="Abrir índice de slides"></button>
      <button id="fullscreen" class="icon-button" aria-label="Ativar tela cheia"></button>
    </footer>
    <span class="sr-only" id="announcement" role="status" aria-live="polite"></span>
    <noscript>Ative o JavaScript para navegar pelos slides. <a href="assets/relatorio-api.pdf">Abrir relatório em PDF</a>.</noscript>
  </main>
  <dialog id="index-dialog" aria-labelledby="index-title"><div class="dialog-heading"><div><h2 id="index-title">Escolha um slide.</h2><p>16 variações, organizadas por ocorrência.</p></div><button data-close="index-dialog" class="dialog-close" aria-label="Fechar índice">Fechar</button></div><label class="search-label" for="slide-search">Buscar por bug ou cenário</label><input id="slide-search" type="search" placeholder="Ex.: BUG-007 ou preço" autocomplete="off"><nav id="slide-index" aria-label="Índice da apresentação"></nav></dialog>
  <dialog id="image-dialog" class="image-dialog" aria-labelledby="image-title"><div class="dialog-heading"><h2 id="image-title">Evidência</h2><div class="image-actions"><button id="zoom-image">Ampliar 150%</button><a id="original-image" target="_blank" rel="noopener">Print completo</a><button data-close="image-dialog" class="dialog-close" aria-label="Fechar evidência">Fechar</button></div></div><div id="image-scroll" class="image-scroll"><img id="large-image" alt=""></div></dialog>
<dialog id="variants-dialog" aria-labelledby="variants-title"><div class="dialog-heading"><div><h2 id="variants-title">Variações do bug</h2><p>Selecione uma evidência para mostrá-la no mesmo slide.</p></div><button data-close="variants-dialog" class="dialog-close" aria-label="Fechar variações">Fechar</button></div><div id="variants-list"></div></dialog>
</body>
</html>
